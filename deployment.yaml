apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-profile-poojitha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: personal-profile-poojitha
  template:
    metadata:
      labels:
        app: personal-profile-poojitha
    spec:
      containers:
      - name: personal-profile-poojitha
        image: kurellapoojitha/personal-profile-poojitha:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: personal-profile-service-poojitha
spec:
  type: NodePort
  selector:
    app: personal-profile-poojitha
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30015
